<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポケモントレーナー検索</title>

<style>
body {
    font-family: sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
}

input {
    font-size: 18px;
    padding: 8px;
}

button {
    font-size: 18px;
    padding: 8px 12px;
}

#result {
    margin-top: 30px;
    line-height: 1.8;
}
</style>
</head>

<body>

<h1>キミはポケモントレーナー？</h1>

<p>あなたの名前を入れてください</p>

<input id="searchName" type="text">
<button onclick="searchTrainer()">さがす</button>

<div id="result"></div>

<script>

let trainers = [];

fetch("pokemon-trainer-db.csv")
  .then(response => response.text())
  .then(text => {
      const rows = text.trim().split("\n");

      const headers = rows[0].split(",");

      for(let i = 1; i < rows.length; i++) {
          const values = rows[i].split(",");

          let obj = {};

          headers.forEach((header, index) => {
              obj[header.trim()] = values[index] || "";
          });

          trainers.push(obj);
      }
  });

function hiraToKata(str) {
    return str.replace(/[\u3041-\u3096]/g, function(match) {
        return String.fromCharCode(match.charCodeAt(0) + 0x60);
    });
}

function searchTrainer() {

    const input = document.getElementById("searchName").value.trim();

    const searchName = hiraToKata(input);

    const trainer = trainers.find(t => t["名前"] === searchName);

    const result = document.getElementById("result");

    if (!trainer) {
        result.innerHTML = "まだいないみたい";
        return;
    }

let pokemonList = "";

for(let i = 1; i <= 6; i++) {
    const pokemon = trainer[`手持ち${i}`] || trainer[`手持ち${i} `] || trainer[`手持ち${i}　`];

    if(pokemon){
        pokemonList += `・${pokemon}<br>`;
    }
}

let pokemonSection = "";

if (pokemonList) {
    pokemonSection = `
        <h3>手持ち</h3>
        ${pokemonList}
    `;
}
    
    let giftText = "";

    if(trainer["くれるもの"]){
        giftText = `<p>${trainer["くれるもの"]} をくれるよ</p>`;
    }

    result.innerHTML = `
    
        <p>${trainer["地方"]} にいます！</p>
        
        <h2> ${trainer["肩書き"]} の ${trainer["名前"]}</h2>

        ${pokemonSection}

        ${giftText}
    `;
}

</script>

</footer>
</body>
</html>
