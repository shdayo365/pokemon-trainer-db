<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <img
    src="images/trainers/${trainer["画像ファイル"]}"
    width="200"
    style="display:block;margin:10px auto;"
    onerror="this.style.display='none'"
>
<title>ポケモントレーナー検索</title>

<style>
    /* CSSのコメントはこれ */
body {
    font-family: sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;

    background-image: url("images/ui/bg-ball.png");
    background-repeat: repeat;
}

input {
    font-size: 18px;
    padding: 8px;
}

button {
    font-size: 18px;
    padding: 8px 12px;
}

#result {
    margin-top: 30px;
    line-height: 1.8;
}

    /* ここからトレーナーカード用 */
.trainer-card{
    border:1px solid #ccc;
    border-radius:12px;
    padding:20px;
    margin:20px 0;
}

.trainer-main{
    display:flex;
    gap:30px;
    align-items:flex-start;
}

.trainer-left{
    width:220px;
    text-align:center;
}

.trainer-right{
    flex:1;
}

.trainer-image{
    width:200px;
}

.location{
    font-weight:bold;
    margin-bottom:15px;
}

.series-icon{
    width:24px;
    vertical-align:middle;
    margin-right:5px;
}

.trainer-name{
    margin-bottom:15px;
}
</style>
</head>

<body>

<h1>キミはポケモントレーナー？</h1>

<p>あなたの名前を入れてください</p>

<input
  id="searchName"
  type="text"
  onkeydown="handleKey(event)"
>
<button onclick="searchTrainer()">さがす</button>

<div id="result"></div>

<script>
    // JavaScriptのコメント1行はこれ
/*
複数行コメントはこれ
コメントというかコードの無効化に使えるよ
なるほど
*/

let trainers = [];

fetch("pokemon-trainer-db.csv")
  .then(response => response.text())
  .then(text => {
      const rows = text.trim().split("\n");

      const headers = rows[0].split(",");

      for(let i = 1; i < rows.length; i++) {
          const values = rows[i].split(",");

          let obj = {};

          headers.forEach((header, index) => {
              obj[header.trim()] = values[index] || "";
          });

          trainers.push(obj);
      }
  });

function hiraToKata(str) {
    return str.replace(/[\u3041-\u3096]/g, function(match) {
        return String.fromCharCode(match.charCodeAt(0) + 0x60);
    });
}

    function handleKey(event) {
    if (event.keyCode === 229) return;

    if (event.key === "Enter") {
        searchTrainer();
    }
}
    
    
function searchTrainer() {

    const input = document.getElementById("searchName").value.trim();

    const searchName = hiraToKata(input);

    const matchedTrainers = trainers.filter(t => t["名前"] === searchName);

    const result = document.getElementById("result");

    if (matchedTrainers.length === 0) {
    result.innerHTML = "まだいないみたい";
    return;
}

let html = "";

matchedTrainers.forEach(trainer => {

    let pokemonList = "";

    for(let i = 1; i <= 6; i++) {
        const pokemon = trainer[`手持ち${i}`] || trainer[`手持ち${i} `] || trainer[`手持ち${i}　`];

        if(pokemon){
            pokemonList += `
<img src="images/ui/monsterball.png" width="16" style="vertical-align:middle;">
${pokemon}<br>
`;
        }
    }

    let pokemonSection = "";

    if (pokemonList) {
        pokemonSection = `
            <p style="margin-bottom:0;">手持ち</p>
            ${pokemonList}
        `;
    }

    let giftText = "";

    if(trainer["くれるもの"]){
        giftText = `<p>${trainer["くれるもの"]} をくれるよ</p>`;
    }

        html += `
<div class="trainer-card">

    <div class="location">
        
        ${trainer["地方"]}にいるよ！
    </div>

    <div class="trainer-main">

    <h2 class="trainer-name">
        ${trainer["肩書き"]} の ${trainer["名前"]}
    </h2>

    <div class="trainer-main">

        <div class="trainer-left">
    <img
        src="images/trainers/${trainer["画像ファイル"]}"
        class="trainer-image"
        onerror="this.style.display='none'"
    >
</div>

        <div class="trainer-right">
            ${pokemonSection}
        </div>

    </div>

</div>

    ${giftText}

</div>
`;
});

result.innerHTML = html;
}

</script>
