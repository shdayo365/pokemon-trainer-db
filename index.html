<style>
    /* CSSのコメントはこれ */
body {
    font-family: sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;

    background-image: url("images/ui/bg-ball.png");
    background-repeat: repeat;
}

input {

}

button {
    font-size: 18px;
    padding: 8px 12px;
}

    margin-top: 30px;

#backToTop {
    position: fixed;
    left: 20px;

    cursor: pointer;
}

    position: relative;
    display: inline-block;
}

.search-box input {
    padding-right: 35px;
}

.clear-button {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    
    border: none;
    background: none;
    padding: 0;
    font-size: 20px;

}

    /* ここからトレーナーカード用 */

   /*　角丸枠
.trainer-card{
    border:1px solid #ccc;
    border-radius:12px;
    padding:20px;
    margin:20px 0;
} */

.trainer-card{
    border:none;
    border-bottom:1px solid #ccc;
    padding:5px 0;
    margin:5px 0;
}

.trainer-card:last-child{
    border-bottom:none;
}

.trainer-main{
    display:flex;
    gap:30px;
    align-items:flex-start;
}

.trainer-left{
    width:220px;
    text-align:center;
}

.trainer-right{
    flex:1;
}

.trainer-image{
    width:200px;
}

.location{
    font-weight:normal;
    margin-bottom:15px;
}

    height:30px;
    vertical-align:middle;
    margin-right:5px;
}

    margin-bottom:15px;
}

    display:inline;
}

@media (max-width: 600px){

    .trainer-main{
        flex-direction: row;
        align-items: flex-start;
    }

    .trainer-left{
        width: 150px;
        flex-shrink: 0;
    }

    .trainer-right{
        flex: 1;
        width: auto;
        text-align: left;
    }

    .trainer-image{

<body>

<h1>きみはポケモントレーナー？</h1>

<p>あなたの名前を入れてください</p>

<div class="search-box">
    <input
  id="searchName"
  type="text"
  onkeydown="handleKey(event)"
>
    <button class="clear-button" onclick="clearSearch()">×</button>
</div>

<button onclick="searchTrainer()">さがす</button>
<div id="result"></div>
   
<button id="backToTop">↑ 上へ</button>

<script>
    // JavaScriptのコメント1行はこれ
/*
複数行コメントはこれ
コメントというかコードの無効化に使えるよ
なるほど
*/

let trainers = [];

fetch("pokemon-trainer-db.csv")
  .then(response => response.text())
  .then(text => {
      const rows = text.trim().split("\n");

      const headers = rows[0].split(",");

      for(let i = 1; i < rows.length; i++) {
          const values = rows[i].split(",");

          let obj = {};

          headers.forEach((header, index) => {
              obj[header.trim()] = values[index] || "";
          });

          trainers.push(obj);
      }
  });

let seriesData = [];
    
    fetch("pokemon-Series.csv")
  .then(response => response.text())
  .then(text => {

      const rows = text.trim().split("\n");
      const headers = rows[0].split(",");

      for(let i = 1; i < rows.length; i++) {

          const values = rows[i].split(",");

          let obj = {};

          headers.forEach((header, index) => {
              obj[header.trim()] = values[index] || "";
          });

          seriesData.push(obj);
      }
  });

function hiraToKata(str) {
    return str.replace(/[\u3041-\u3096]/g, function(match) {
        return String.fromCharCode(match.charCodeAt(0) + 0x60);
    });
}

function clearSearch() {
    document.getElementById("searchName").value = "";
}
   
    function handleKey(event) {
    if (event.keyCode === 229) return;

    if (event.key === "Enter") {
        searchTrainer();
    }
}
    
    
function searchTrainer() {

    const input = document.getElementById("searchName").value.trim();

    const searchName = hiraToKata(input);

    const matchedTrainers = trainers.filter(
    t => hiraToKata(t["名前"]) === searchName
);

   matchedTrainers.sort((a, b) => {
    return Number(a["表示順"]) - Number(b["表示順"]);
});
   
    const result = document.getElementById("result");

    if (matchedTrainers.length === 0) {
    result.innerHTML = "まだいないみたい";
    return;
}    

let html = "";

matchedTrainers.forEach(trainer => {

    const seriesInfo = seriesData.find(
    s => s["シリーズ"] === trainer["シリーズ"]
);

    const seriesIcon = seriesInfo
    ? seriesInfo["シリーズアイコン"]
    : "";

   // 手持ち1が「＊」なら、トレーナーではない
   const isNotTrainer = trainer["手持ち1"] === "*";

    let pokemonList = "";

    for(let i = 1; i <= 6; i++) {
        const pokemon = trainer[`手持ち${i}`] || trainer[`手持ち${i} `] || trainer[`手持ち${i}　`];

       //　「*」は判定用なので、手持ちとして表示しない
       if(pokemon && pokemon !== "*") {
          
            pokemonList += `
<img src="images/ui/monsterball.png" width="16" style="vertical-align:middle;">
${pokemon}<br>
`;
        }
    }

    let pokemonSection = "";

    if (pokemonList) {
        pokemonSection = `
            <p style="margin-bottom:0;">手持ち</p>
            ${pokemonList}
        `;
    }

    let giftText = "";

    if (trainer["くれるもの"].trim()) {
    giftText = `<p>${trainer["くれるもの"].trim()}をくれるよ</p>`;
}

   let itemText = "";

if (trainer["もちもの"].trim()) {
    itemText = `<p>${trainer["もちもの"].trim()}をもってるよ</p>`;
}

        html += `
<div class="trainer-card">

    <div class="location">

    ${isNotTrainer ? "トレーナーではないけど<br>" : ""}
    
 <img
    src="images/series/${seriesIcon}"
    class="series-icon"
    onerror="this.style.display='none'"
>
        ${trainer["地方"]}
        <span class="mobile-break">
        ${trainer["会える場所"]}にいるよ！
        </span>
</div>

    <h2 class="trainer-name">
        ${trainer["肩書き"]} の ${trainer["名前"]}
    </h2>

    <div class="trainer-main">

        <div class="trainer-left">
    <img
        src="images/trainers/${trainer["画像ファイル"]}"
        class="trainer-image"
        onerror="this.style.display='none'"
    >
</div>

        <div class="trainer-right">
            ${pokemonSection}
        </div>

   </div>

    ${giftText}
    ${itemText}

</div>
        
    </div>
`;
});

result.innerHTML = html;
}

document.getElementById("backToTop").addEventListener("click", function() {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

</script>
